site_name: SEC Submissions
site_description: Evidence-based processing of SEC EDGAR submissions timestamps
site_url: https://iangow.github.io/sec_submissions/
repo_url: https://github.com/iangow/sec_submissions
repo_name: iangow/sec_submissions

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Start here: index.md
  - Get the data: data.md
  - Audit results: audit.md
  - Timestamp corrections: timestamps.md
  - Advanced:
      - Prepare an update: workflow.md
      - Python API: api.md
  - Maintainers:
      - Data releases: releases.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
